<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-border" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".1"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2937" stroke-opacity=".4" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-orb{0%{transform:scale(1);opacity:.35}50%{transform:scale(1.15);opacity:.55}}@keyframes float-card-1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes float-card-2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.title{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-1px}.badge-text,.subtitle,.tagline,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text,.tagline{font-weight:600}.tagline{font-size:14px;fill:#38bdf8;letter-spacing:2px;text-transform:uppercase}.badge-text{font-size:13px;fill:#e2e8f0}.orb-1{transform-origin:200px 150px;animation:pulse-orb 8s ease-in-out infinite}.orb-2{transform-origin:1000px 250px;animation:pulse-orb 10s ease-in-out infinite 2s}.floating-card-1{animation:float-card-1 6s ease-in-out infinite}.floating-card-2{animation:float-card-2 7s ease-in-out infinite 1s}.animated-wire{stroke-dasharray:8,8;animation:dash-move 3s linear infinite}</style><rect width="1200" height="420" fill="url(#bg-grad)"/><rect width="1200" height="420" fill="url(#grid)"/><g filter="url(#glow)"><circle cx="220" cy="120" r="140" fill="#38bdf8" class="orb-1" opacity=".25"/><circle cx="980" cy="240" r="170" fill="#818cf8" class="orb-2" opacity=".22"/><circle cx="600" cy="380" r="110" fill="#c084fc" class="orb-1" opacity=".18"/></g><g opacity=".85"><path fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="2" d="M 100 350 C 300 280, 500 400, 750 330 C 900 290, 1050 360, 1150 310" class="animated-wire"/><path fill="none" stroke="#818cf8" stroke-opacity=".3" stroke-width="2" d="M 50 100 C 250 50, 450 140, 700 80 C 950 20, 1100 120, 1180 80" class="animated-wire"/><g class="floating-card-1" transform="translate(860, 60)"><rect width="260" height="56" fill="#1e293b" fill-opacity=".75" stroke="url(#card-border)" stroke-width="1.5" rx="28"/><circle cx="30" cy="28" r="14" fill="#38bdf8" fill-opacity=".2"/><circle cx="30" cy="28" r="6" fill="#38bdf8"/><text x="56" y="33" class="badge-text">⚡ Quote-to-Cash Automation</text></g><g class="floating-card-2" transform="translate(890, 140)"><rect width="240" height="56" fill="#1e293b" fill-opacity=".75" stroke="url(#card-border)" stroke-width="1.5" rx="28"/><circle cx="30" cy="28" r="14" fill="#10b981" fill-opacity=".2"/><circle cx="30" cy="28" r="6" fill="#10b981"/><text x="56" y="33" class="badge-text">🏢 Tiered B2B Catalogs</text></g><g class="floating-card-1" transform="translate(840, 220)"><rect width="280" height="56" fill="#1e293b" fill-opacity=".75" stroke="url(#card-border)" stroke-width="1.5" rx="28"/><circle cx="30" cy="28" r="14" fill="#c084fc" fill-opacity=".2"/><circle cx="30" cy="28" r="6" fill="#c084fc"/><text x="56" y="33" class="badge-text">🔄 ERP &amp; Recurring Invoicing</text></g></g><g transform="translate(80, 75)"><rect width="295" height="32" fill="#0284c7" fill-opacity=".15" stroke="#38bdf8" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="4" fill="#38bdf8"/><text x="32" y="21" class="tagline">Enterprise &amp; Open Source</text></g><g><text class="title" transform="translate(80, 160)">Awesome <tspan fill="url(#primary-grad)">B2B E-Commerce</tspan> &amp; Billing</text></g><g><text class="subtitle" transform="translate(80, 208)">Curated platforms, headless commerce engines, ERP integrations &amp; subscription billing tools.</text></g><g><g transform="translate(80, 280) translate(0, 0)"><rect width="180" height="42" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">💼 Net Terms &amp; POs</text></g><g transform="translate(80, 280) translate(195, 0)"><rect width="195" height="42" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">📦 Wholesale Portals</text></g><g transform="translate(80, 280) translate(405, 0)"><rect width="215" height="42" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">📊 Subscription Billing</text></g><g transform="translate(80, 280) translate(635, 0)"><rect width="170" height="42" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="10"/><text x="18" y="26" class="badge-text">🔓 Self-Hosted</text></g></g></svg>